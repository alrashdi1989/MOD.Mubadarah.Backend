version: '3.8'

services:
  pms-angular:
    image: mod/pms-angular:latest
    container_name: pms-angular
    build:
      context: ../../../
      dockerfile: angular/Dockerfile.local
    ports:
      - "4200:80"
    depends_on:
      - pms-api
    volumes:
      - ./dynamic-env.json://usr/share/nginx/html/dynamic-env.json
    networks:
      - abp-network

  pms-api:
    image: mod/pms-api:latest
    container_name: pms-api
    hostname: pms-api
    build:
      context: ../../
      dockerfile: src/MOD.Pms.HttpApi.Host/Dockerfile.local
    environment:
      - ASPNETCORE_URLS=https://+:443;http://+:80;
      - Kestrel__Certificates__Default__Path=/root/certificate/localhost.pfx
      - Kestrel__Certificates__Default__Password=4c26f3cc-f444-4b8d-82be-dd40c1ea0c9c
      - App__SelfUrl=https://localhost:44368
      - App__AngularUrl=http://localhost:4200
      - App_CorsOrigins=http://localhost:4200
      - App__HealthCheckUrl=http://pms-api/health-status
      - AuthServer__RequireHttpsMetadata=false
      - AuthServer__Authority=http://pms-authserver
      - ConnectionStrings__Default=Data Source=sql-server;Initial Catalog=Pms;User Id=sa;Password=P@ssw0rd;MultipleActiveResultSets=true;TrustServerCertificate=True;
      - Redis__Configuration=redis
    ports:
      - "44368:443"
    depends_on:
      sql-server:
        condition: service_healthy
      redis:
        condition: service_healthy  
    restart: on-failure    
    volumes:
      - ./certs:/root/certificate
    networks:
      - abp-network
  
  pms-authserver:
    image: mod/pms-authserver:latest
    container_name: pms-authserver
    build:
      context: ../../
      dockerfile: src/MOD.Pms.AuthServer/Dockerfile.local
    environment:
      - ASPNETCORE_URLS=https://+:443;http://+:80;
      - App__SelfUrl=https://localhost:44386
      - App__CorsOrigins=http://localhost:4200,http://localhost:44307
      - AuthServer__RequireHttpsMetadata=false
      - AuthServer__Authority=https://localhost:44386/
      - AuthServer__ValidIssuers__0=https://localhost:44386
      - AuthServer__ValidIssuers__1=http://127.0.0.1:44386
      - Kestrel__Certificates__Default__Path=/root/certificate/localhost.pfx
      - Kestrel__Certificates__Default__Password=4c26f3cc-f444-4b8d-82be-dd40c1ea0c9c
      - ConnectionStrings__Default=Data Source=sql-server;Initial Catalog=Pms;User Id=sa;Password=P@ssw0rd;MultipleActiveResultSets=true;TrustServerCertificate=True;
      - Redis__Configuration=redis
    ports:
      - "44386:443"
    depends_on:
      sql-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./certs:/root/certificate
    networks:
      - abp-network

  db-migrator:
    image: mod/pms-db-migrator:latest
    container_name: db-migrator
    build:
      context: ../../
      dockerfile: src/Pms.DbMigrator/Dockerfile.local
    environment:
      - OpenIddict__Applications__Pms_App__RootUrl=http://localhost:4200
      - OpenIddict__Applications__Pms_Swagger__RootUrl=https://localhost:44368
      - ConnectionStrings__Default=Data Source=sql-server;Initial Catalog=Pms;User Id=sa;Password=P@ssw0rd;MultipleActiveResultSets=true;TrustServerCertificate=True;
      - Redis__Configuration=redis
    restart: on-failure
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      - abp-network    
  
  sql-server:
    container_name: sql-server
    image: mcr.microsoft.com/mssql/server:2019-latest
    ports:
      - "1434:1433"
    environment:
      SA_PASSWORD: "P@ssw0rd"
      ACCEPT_EULA: "Y"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - abp-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S sql-server -U sa -P "P@ssw0rd" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  
  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - abp-network  
    healthcheck:
      test: ["CMD", "redis-cli","ping"]      

volumes:
  sqldata:
    name: pms_sqldata
networks:
  abp-network:
    name: pms-network
    driver: bridge
